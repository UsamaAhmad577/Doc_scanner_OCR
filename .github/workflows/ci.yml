name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Tesseract binary
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 . --max-line-length=100 --exclude=tests/generate_fixture.py

      - name: Generate test fixture
        run: python tests/generate_fixture.py

      - name: Run tests
        run: pytest tests/ -v
